  risks:
    medium:
      - id: "RISK-7.1-M1"
        title: "Cache Eviction Algorithm Not Optimal"
        probability: "Medium"
        impact: "Medium"
        description: "Current FIFO eviction using Cache.Next() may not evict optimal entries. Frequently accessed objects could be evicted instead of cold ones."
        mitigation: "Acceptable for initial implementation (v1.0). Track hit ratio to detect poor performance. Consider implementing LRU in future version for better cache efficiency."
        monitoring: "Monitor GetHitRatio() - if drops below 50%, investigate eviction patterns"
        blocking: false
      
      - id: "RISK-7.1-M2"
        title: "Memory Consumption with Large Cache"
        probability: "Medium"
        impact: "Medium"
        description: "MAXCACHESIZE=1000 could consume significant memory with large patient objects. No memory monitoring or automatic cleanup beyond size limit."
        mitigation: "Document cache limits and memory implications. Recommend monitoring memory usage in production. EnforceCacheLimit evicts 10% when exceeded."
        monitoring: "Monitor memory usage in high-volume scenarios, adjust MAXCACHESIZE if needed"
        blocking: false
    
    low:
      - id: "RISK-7.1-L1"
        title: "Silent Loader Failures in GetOrLoad"
        probability: "Low"
        impact: "Low"
        description: "GetOrLoad returns empty on loader errors without detailed logging, could make debugging difficult in production."
        mitigation: "Try/Catch present, graceful degradation acceptable. Loader classes should have their own error handling and logging."
        blocking: false
      
      - id: "RISK-7.1-L2"
        title: "Thread Safety Not Explicitly Handled"
        probability: "Low"
        impact: "Low"
        description: "No explicit locking for concurrent access. Could have race conditions in multi-threaded scenarios."
        mitigation: "IRIS sessions typically single-threaded. Document limitation in multi-threaded contexts. Add explicit locking if needed in future."
        blocking: false
  
